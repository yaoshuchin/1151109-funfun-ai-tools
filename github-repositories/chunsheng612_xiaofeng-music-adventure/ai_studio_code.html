<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小風的音樂冒險 - 互動控制版</title>
    <style>
        :root {
            --flip-speed: 1.8s;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle, #fffdf5 0%, #e8e4d8 100%);
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            overflow: hidden;
        }

        .book-container {
            position: relative;
            width: 800px;
            height: 450px;
            perspective: 2500px;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-origin: left center;
            transition: transform var(--flip-speed) cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            z-index: 1;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0 15px 15px 0;
            backface-visibility: hidden;
            box-shadow: 5px 5px 25px rgba(0,0,0,0.15);
            display: block;
        }

        .page.flipped {
            transform: rotateY(-175deg) scale(0.97);
        }

        /* 按鈕樣式 */
        .music-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: white;
            border: 3px solid #ffcc00;
            border-radius: 50px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            z-index: 100;
            transition: all 0.3s ease;
            color: #5d4037;
            font-weight: bold;
            font-size: 18px;
            user-select: none;
        }

        .music-btn.playing {
            background: #ffcc00;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 204, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); }
        }

        .controls {
            margin-top: 50px;
            display: flex;
            gap: 40px;
            align-items: center;
        }

        button.nav-btn {
            padding: 12px 35px;
            font-size: 18px;
            cursor: pointer;
            background: #6d4c41;
            color: white;
            border: none;
            border-radius: 50px;
            transition: 0.3s;
        }

        button.nav-btn:hover {
            background: #8d6e63;
        }

        .page-info {
            font-size: 20px;
            color: #5d4037;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="book-container" id="book"></div>

    <div class="controls">
        <button class="nav-btn" onclick="prevPage()">上一頁</button>
        <span class="page-info" id="pageDisplay">1 / 13</span>
        <button class="nav-btn" onclick="nextPage()">下一頁</button>
    </div>

    <script>
        const totalPages = 13;
        const book = document.getElementById('book');
        let currentPage = 0;
        
        // 音訊管理
        let currentAudio = null;         // 存儲 MP3 對象
        let currentOscillator = null;    // 存儲備用合成器對象
        let activeBtn = null;            // 存儲目前正在播放的按鈕 DOM

        // 初始化頁面
        for (let i = totalPages - 1; i >= 0; i--) {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            pageDiv.id = `page-${i}`;
            pageDiv.style.zIndex = totalPages - i;
            
            const img = document.createElement('img');
            img.src = `${i}.png`;
            img.onerror = function() { this.src = `https://via.placeholder.com/800x450?text=Page+${i}`; };
            pageDiv.appendChild(img);

            const pageNumber = i + 1;
            if (pageNumber >= 4 && pageNumber <= 8) {
                const btn = document.createElement('div');
                btn.className = 'music-btn';
                btn.id = `btn-${pageNumber}`;
                btn.innerHTML = '<span>🎵 聆聽音樂</span>';
                btn.onclick = (e) => {
                    e.stopPropagation();
                    toggleMusic(pageNumber, btn);
                };
                pageDiv.appendChild(btn);
            }
            book.appendChild(pageDiv);
        }

        function stopAllMusic() {
            // 停止 MP3
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            // 停止合成音
            if (currentOscillator) {
                try { currentOscillator.stop(); } catch(e) {}
                currentOscillator = null;
            }
            // 重置按鈕樣式
            if (activeBtn) {
                activeBtn.classList.remove('playing');
                activeBtn.innerHTML = '<span>🎵 聆聽音樂</span>';
                activeBtn = null;
            }
        }

        function toggleMusic(pageNumber, btn) {
            // 如果點擊的是正在播放的按鈕 -> 停止
            if (activeBtn === btn) {
                stopAllMusic();
                return;
            }

            // 如果點擊新按鈕 -> 先停止舊的
            stopAllMusic();

            activeBtn = btn;
            btn.classList.add('playing');
            btn.innerHTML = '<span>⏹ 停止播放</span>';

            const audioFile = `${pageNumber}.mp3`;
            const audio = new Audio(audioFile);
            currentAudio = audio;

            audio.play().catch(() => {
                console.warn(`找不到 ${audioFile}，啟動備援合成音`);
                playFallbackSynth(pageNumber);
            });

            // 音樂播放結束後自動重置按鈕
            audio.onended = () => stopAllMusic();
        }

        function nextPage() {
            if (currentPage < totalPages - 1) {
                stopAllMusic(); // 翻頁時停止音樂
                const page = document.getElementById(`page-${currentPage}`);
                page.classList.add('flipped');
                currentPage++;
                updateDisplay();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                stopAllMusic(); // 翻頁時停止音樂
                currentPage--;
                const page = document.getElementById(`page-${currentPage}`);
                page.classList.remove('flipped');
                updateDisplay();
            }
        }

        function updateDisplay() {
            document.getElementById('pageDisplay').innerText = `${currentPage + 1} / ${totalPages}`;
        }

        book.addEventListener('click', () => nextPage());

        // --- 備援合成音邏輯 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playFallbackSynth(pageNumber) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            currentOscillator = osc;
            const now = audioCtx.currentTime;

            // 簡單頻率分配
            const frequencies = { 4: 110, 5: 440, 6: 220, 7: 349, 8: 523 };
            osc.frequency.setValueAtTime(frequencies[pageNumber] || 440, now);
            osc.type = 'triangle';

            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 3);

            osc.start(now);
            osc.stop(now + 3);
            
            osc.onended = () => {
                if (activeBtn && activeBtn.id === `btn-${pageNumber}`) {
                    stopAllMusic();
                }
            };
        }
    </script>
</body>
</html>
