<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考試倒數計時器 v3.1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        :root {
            /* 配色保持不變，但在有圖片背景時，毛玻璃效果更佳 */
            --primary-color: #007AFF;
            --card-bg: rgba(255, 255, 255, 0.65); /* 稍微調低透明度以適應圖片背景 */
            --card-border: rgba(255, 255, 255, 0.3);
            --text-color-primary: #1d1d1f;
            --text-color-secondary: #3c3c43; /* 次要文字加深一點點，提高對比 */
            --input-bg: rgba(235, 235, 240, 0.7);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --danger-color: #FF3B30;
            --control-border-radius: 12px;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            color: var(--text-color-primary);
            -webkit-font-smoothing: antialiased;

            /* 【修改 #2】引用本地背景圖片 */
            background-image: url('1.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        .app-screen { display: none; padding: 20px; width: 100%; height: 100%; }
        .app-screen.active { display: block; animation: screenFadeIn 0.5s ease; }
        @keyframes screenFadeIn { from { opacity: 0; } to { opacity: 1; } }

        .container { max-width: 700px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        h1 { 
            font-weight: 700; 
            font-size: 2.5em; 
            color: #fff; /* 在深色圖片背景下，標題改為白色 */
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .card { background: var(--card-bg); backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%); border-radius: 20px; border: 1px solid var(--card-border); box-shadow: 0 8px 30px var(--shadow-color); padding: 30px; }
        h2 { font-weight: 600; color: var(--text-color-primary); margin: 0 0 20px; text-align: left; font-size: 1.2em;}
        
        input, select, button { border-radius: var(--control-border-radius) !important; font-family: inherit; }
        input, select { background-color: var(--input-bg); border: 1px solid rgba(0,0,0,0.05); padding: 12px 16px; font-size: 1em; width: 100%; transition: all 0.3s ease; -webkit-appearance: none; color: var(--text-color-primary); }
        input:focus, select:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2); }
        button { padding: 12px 20px; border: none; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .btn-primary { background: var(--primary-color); color: white; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.25); }
        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .btn-primary:disabled { background: #E5E5EA; color: #A9A9B0; cursor: not-allowed; box-shadow: none; transform: none; }
        .btn-secondary { background: var(--input-bg); color: var(--text-color-primary); }
        .btn-secondary:hover { filter: brightness(0.95); }

        .controls-grid { display: grid; grid-template-columns: 1fr auto; gap: 15px; }
        .time-inputs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .time-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .control-group label { font-size: 0.9em; color: var(--text-color-secondary); margin-bottom: 8px; font-weight: 500; display: block; }
        #add-exam-btn { align-self: end; }

        #schedule-list { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
        .exam-item { display: flex; align-items: center; padding: 15px; background-color: var(--input-bg); border-radius: var(--control-border-radius); animation: fadeIn 0.4s ease forwards; }
        .exam-time { font-weight: 600; font-size: 1.1em; width: 140px; }
        .exam-subject { font-weight: 500; flex-grow: 1; }
        .delete-exam-btn { background: none; border: none; color: var(--danger-color); font-size: 1.5em; line-height: 1; padding: 0 5px; cursor: pointer; opacity: 0.5; }
        .delete-exam-btn:hover { opacity: 1; }
        .main-actions { display: flex; gap: 15px; margin-top: 30px; border-top: 1px solid var(--card-border); padding-top: 30px; }
        .main-actions button { flex-grow: 1; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 倒數計時畫面 --- */
        #countdown-screen { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #countdown-screen.active { display: flex; }
        .countdown-content { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; width: 100%; }

        /* 【新增 #1】時間顯示區塊的毛玻璃樣式 */
        .time-display-box {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 15px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            color: #fff; /* 在毛玻璃上的文字用白色 */
            text-shadow: 0 1px 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        #current-time-box { margin-bottom: 3vh; }
        #current-time { font-size: clamp(2em, 8vw, 3em); font-weight: 600; }
        
        #countdown-label { font-size: 1.8em; font-weight: 500; color: #fff; text-shadow: 0 1px 5px rgba(0,0,0,0.2); }
        #next-subject { font-size: clamp(2.8em, 10vw, 5.5em); font-weight: 700; margin: 10px 0; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        
        #countdown-timer-box { padding: 20px 40px; }
        #countdown-timer { font-family: 'Inter', monospace; font-size: clamp(4.5em, 20vw, 10em); font-weight: 900; }
        
        .countdown-footer { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        #fullscreen-btn { background: none; border: none; cursor: pointer; padding: 10px; }
        #fullscreen-btn svg { width: 28px; height: 28px; fill: rgba(255,255,255,0.7); transition: all 0.2s ease; }
        #fullscreen-btn:hover svg { fill: #fff; transform: scale(1.1); }
        #back-to-setup-btn.btn-secondary { background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <div id="setup-screen" class="app-screen active">
        <div class="container">
            <div class="header"><h1>考試倒數計時器</h1></div>
            <div class="card">
                <h2>新增考試時程</h2>
                <div class="controls-grid">
                    <div class="control-group"><label for="subject-input">考試科目</label><input type="text" id="subject-input" placeholder="例如：國文"></div>
                    <div class="time-inputs">
                        <div class="control-group"><label>開始時間</label><div class="time-group"><select id="start-hour-select"></select><select id="start-minute-select"></select></div></div>
                        <div class="control-group"><label>結束時間</label><div class="time-group"><select id="end-hour-select"></select><select id="end-minute-select"></select></div></div>
                    </div>
                    <button id="add-exam-btn" class="btn-primary">新增</button>
                </div>
                <div id="schedule-list"></div>
                <div class="main-actions">
                    <button id="clear-schedule-btn" class="btn-secondary">清空全部</button>
                    <button id="start-countdown-btn" class="btn-primary" disabled>開始計時</button>
                </div>
            </div>
        </div>
    </div>

    <div id="countdown-screen" class="app-screen">
        <div class="countdown-content">
            <!-- 【修改 #1】為時間加上獨立的毛玻璃容器 -->
            <div id="current-time-box" class="time-display-box">
                <h1 id="current-time">00:00:00</h1>
            </div>
            <p id="countdown-label">準備開始</p>
            <h2 id="next-subject">科目名稱</h2>
            <div id="countdown-timer-box" class="time-display-box">
                <div id="countdown-timer">00:00:00</div>
            </div>
        </div>
        <div class="countdown-footer">
            <button id="back-to-setup-btn" class="btn-secondary">返回設定</button>
            <button id="fullscreen-btn" title="切換全螢幕">
                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
        </div>
    </div>

    <script>
        // JavaScript 邏輯與 v3.0 完全相同，無需修改
        document.addEventListener('DOMContentLoaded', () => {
            const screens = document.querySelectorAll('.app-screen');
            const subjectInput = document.getElementById('subject-input');
            const startHourSelect = document.getElementById('start-hour-select');
            const startMinuteSelect = document.getElementById('start-minute-select');
            const endHourSelect = document.getElementById('end-hour-select');
            const endMinuteSelect = document.getElementById('end-minute-select');
            const addExamBtn = document.getElementById('add-exam-btn');
            const scheduleList = document.getElementById('schedule-list');
            const clearScheduleBtn = document.getElementById('clear-schedule-btn');
            const startCountdownBtn = document.getElementById('start-countdown-btn');
            const currentTimeDisplay = document.getElementById('current-time');
            const countdownLabel = document.getElementById('countdown-label');
            const nextSubjectDisplay = document.getElementById('next-subject');
            const countdownTimerDisplay = document.getElementById('countdown-timer');
            const backToSetupBtn = document.getElementById('back-to-setup-btn');
            const fullscreenBtn = document.getElementById('fullscreen-btn');

            let schedule = [];
            let timerInterval = null;

            const padZero = (num) => num.toString().padStart(2, '0');

            const populateTimeSelector = (hourEl, minuteEl) => {
                for (let i = 0; i < 24; i++) hourEl.add(new Option(padZero(i), i));
                for (let i = 0; i < 60; i += 5) minuteEl.add(new Option(padZero(i), i));
            };
            
            const renderSchedule = () => {
                scheduleList.innerHTML = '';
                schedule.sort((a, b) => a.startTime - b.startTime);
                if (schedule.length === 0) {
                    scheduleList.innerHTML = `<p style="text-align:center; color: var(--text-color-secondary);">請新增考試時程...</p>`;
                } else {
                    schedule.forEach(exam => {
                        const item = document.createElement('div');
                        item.className = 'exam-item';
                        const startTimeStr = `${padZero(exam.startTime.getHours())}:${padZero(exam.startTime.getMinutes())}`;
                        const endTimeStr = `${padZero(exam.endTime.getHours())}:${padZero(exam.endTime.getMinutes())}`;
                        item.innerHTML = `<span class="exam-time">${startTimeStr} - ${endTimeStr}</span><span class="exam-subject">${exam.subject}</span><button class="delete-exam-btn" data-id="${exam.id}">&times;</button>`;
                        scheduleList.appendChild(item);
                    });
                }
                updateButtonsState();
            };

            const updateButtonsState = () => {
                startCountdownBtn.disabled = schedule.length === 0;
                clearScheduleBtn.disabled = schedule.length === 0;
            };

            const addExam = () => {
                const subject = subjectInput.value.trim();
                if (!subject) { alert('請輸入考試科目！'); return; }
                
                const getSelectedTime = (hEl, mEl) => {
                    const d = new Date();
                    d.setHours(parseInt(hEl.value, 10), parseInt(mEl.value, 10), 0, 0);
                    return d;
                };

                const startTime = getSelectedTime(startHourSelect, startMinuteSelect);
                const endTime = getSelectedTime(endHourSelect, endMinuteSelect);

                if (endTime <= startTime) {
                    alert('結束時間必須晚於開始時間！');
                    return;
                }

                schedule.push({ id: Date.now(), subject, startTime, endTime });
                subjectInput.value = '';
                renderSchedule();
            };

            const deleteExam = (id) => {
                schedule = schedule.filter(exam => exam.id !== id);
                renderSchedule();
            };

            const clearSchedule = () => {
                if (confirm('確定要清空所有考試時程嗎？')) {
                    schedule = [];
                    renderSchedule();
                }
            };
            
            const switchScreen = (screenId) => {
                screens.forEach(s => s.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');
                if (screenId === 'countdown-screen') {
                    document.body.style.overflow = 'hidden';
                    updateTimer();
                    timerInterval = setInterval(updateTimer, 1000);
                } else {
                    document.body.style.overflow = 'auto';
                    clearInterval(timerInterval);
                    if (document.fullscreenElement) document.exitFullscreen();
                }
            };
            
            const updateTimer = () => {
                const now = new Date();
                currentTimeDisplay.textContent = `${padZero(now.getHours())}:${padZero(now.getMinutes())}:${padZero(now.getSeconds())}`;
                
                const currentExam = schedule.find(exam => now >= exam.startTime && now < exam.endTime);
                const nextExam = schedule.find(exam => now < exam.startTime);

                let label = "恭喜！";
                let subject = "今日考試已全部結束";
                let countdownTarget = null;
                let decorativeText = "🎉";

                if (currentExam) {
                    label = "考試進行中";
                    subject = currentExam.subject;
                    countdownTarget = currentExam.endTime;
                    decorativeText = "加油！";
                } else if (nextExam) {
                    label = "距離下一場";
                    subject = nextExam.subject;
                    countdownTarget = nextExam.startTime;
                    decorativeText = "準備中";
                }
                
                countdownLabel.textContent = label;
                nextSubjectDisplay.textContent = subject;

                if (countdownTarget) {
                    const diff = countdownTarget - now;
                    const hours = Math.floor(diff / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    countdownTimerDisplay.textContent = `${padZero(hours)}:${padZero(minutes)}:${padZero(seconds)}`;
                } else {
                    countdownTimerDisplay.textContent = decorativeText;
                }
            };

            const toggleFullScreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            };

            // --- Event Listeners ---
            addExamBtn.addEventListener('click', addExam);
            scheduleList.addEventListener('click', (e) => {
                if (e.target.classList.contains('delete-exam-btn')) deleteExam(parseInt(e.target.dataset.id, 10));
            });
            clearScheduleBtn.addEventListener('click', clearSchedule);
            startCountdownBtn.addEventListener('click', () => switchScreen('countdown-screen'));
            backToSetupBtn.addEventListener('click', () => switchScreen('setup-screen'));
            fullscreenBtn.addEventListener('click', toggleFullScreen);
            
            // --- Init ---
            populateTimeSelector(startHourSelect, startMinuteSelect);
            populateTimeSelector(endHourSelect, endMinuteSelect);
            renderSchedule();
        });
    </script>
</body>
</html>
